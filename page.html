<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bracket-web</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #131722; color: #d1d4dc;
    font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace;
  }
  header {
    display: flex; gap: 16px; align-items: center; padding: 6px 10px;
    background: #1e222d; border-bottom: 1px solid #2a2e39; flex-wrap: wrap;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ef5350; display: inline-block; }
  .dot.on { background: #26a69a; }
  input, select, button {
    background: #2a2e39; color: #d1d4dc; border: 1px solid #363c4e;
    padding: 3px 6px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover { background: #363c4e; }
  button:disabled { opacity: 0.4; cursor: default; }
  #arm { background: #1e5c4f; } #arm:hover { background: #26705f; }
  #disarm { background: #6b2c2c; } #disarm:hover { background: #803535; }
  .tf.active { background: #2962ff; }
  main { display: grid; grid-template-columns: 1fr 300px; gap: 8px; padding: 8px; }
  #charts { position: relative; }
  #priceChart { height: 460px; }
  #macdChart { height: 140px; margin-top: 4px; }
  #dragOverlay { position: absolute; top: 0; left: 0; right: 0; height: 460px; cursor: ns-resize; }
  #side { display: flex; flex-direction: column; gap: 8px; }
  .panel { background: #1e222d; border: 1px solid #2a2e39; padding: 6px; }
  .panel h3 { margin: 0 0 6px; font-size: 12px; color: #8b93a6; text-transform: uppercase; }
  #tape { height: 300px; overflow-y: auto; }
  .trow { display: flex; justify-content: space-between; }
  #depth { height: 260px; overflow-y: auto; }
  .drow { display: flex; justify-content: space-between; }
  .bid { color: #26a69a; } .ask { color: #ef5350; }
  #bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 8px 8px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 2px 8px; text-align: left; border-bottom: 1px solid #2a2e39; }
  .lock { color: #eab308; }
  #audit { height: 140px; overflow-y: auto; white-space: pre-wrap; font-size: 11px; color: #8b93a6; }
  #modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center; z-index: 10;
  }
  #modal .box { background: #1e222d; border: 1px solid #363c4e; padding: 20px; min-width: 340px; }
  #modal .box p { margin: 8px 0; }
  #modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
</style>
</head>
<body>
<header>
  <span><span id="dot" class="dot"></span> <span id="connText">connecting</span></span>
  <span>nextId <b id="nextId">-</b></span>
  <span id="reconText"></span>
  <span>symbol <input id="symbol" size="8" value="AAPL"> <button id="go">load</button></span>
  <span>
    <button class="tf active" data-tf="10s">10s</button>
    <button class="tf" data-tf="1m">1m</button>
    <button class="tf" data-tf="1d">1d</button>
  </span>
  <span>
    type
    <select id="otype"><option value="LMT">limit</option><option value="MKT">market</option></select>
    qty <input id="qty" size="4" value="100">
    entry <input id="inEntry" size="8">
    stop <input id="inStop" size="8">
    target <input id="inTarget" size="8">
  </span>
  <button id="arm">arm</button>
  <button id="disarm">disarm</button>
  <span id="note" style="color:#eab308"></span>
</header>

<main>
  <div id="charts">
    <div id="priceChart"></div>
    <div id="dragOverlay"></div>
    <div id="macdChart"></div>
  </div>
  <div id="side">
    <div class="panel"><h3>tape</h3><div id="tape"></div></div>
    <div class="panel"><h3>depth</h3><div id="depth"></div></div>
  </div>
</main>

<div id="bottom">
  <div class="panel">
    <h3>legs</h3>
    <table><thead><tr><th>leg</th><th>state</th><th>filled</th><th>avg price</th><th></th></tr></thead>
    <tbody id="legs"></tbody></table>
  </div>
  <div class="panel"><h3>audit</h3><div id="audit"></div></div>
</div>

<div id="modal"><div class="box">
  <h3>confirm bracket</h3>
  <p id="confirmText"></p>
  <div class="row">
    <button id="confirmNo">cancel</button>
    <button id="confirmYes">place bracket</button>
  </div>
</div></div>

<script>
const $ = (id) => document.getElementById(id);
const COLORS = { entry: '#787b86', stop: '#ef5350', target: '#26a69a' };

let tf = '10s';
let bars = { '10s': new Map(), '1m': new Map(), '1d': new Map() };
let bracket = null;
let pendingSymbols = new Set();
let symbol = $('symbol').value.toUpperCase();

// ---- charts ----
const chartOpts = (extra) => Object.assign({
  layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
  grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
  rightPriceScale: { borderColor: '#2a2e39' },
  timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: true },
}, extra);

const priceChart = LightweightCharts.createChart($('priceChart'), chartOpts());
const priceSeries = priceChart.addCandlestickSeries({
  upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
  wickUpColor: '#26a69a', wickDownColor: '#ef5350',
});

const macdChart = LightweightCharts.createChart($('macdChart'), chartOpts({
  timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: true },
}));
const macdHist = macdChart.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false });
const macdLine = macdChart.addLineSeries({ color: '#2962ff', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
const signalLine = macdChart.addLineSeries({ color: '#ff6d00', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });

// ---- level lines ----
const lines = {};
function setLine(name, price) {
  if (lines[name]) {
    if (price == null) { priceSeries.removePriceLine(lines[name]); delete lines[name]; return; }
    lines[name].applyOptions({ price });
  } else if (price != null) {
    lines[name] = priceSeries.createPriceLine({
      price, color: COLORS[name], lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Solid,
      axisLabelVisible: true, title: name.toUpperCase(),
    });
  }
}
function readLevels() {
  return {
    entry: parseFloat($('inEntry').value),
    stop: parseFloat($('inStop').value),
    target: parseFloat($('inTarget').value),
  };
}
function showLevels(lv) {
  $('inEntry').value = lv.entry || '';
  $('inStop').value = lv.stop || '';
  $('inTarget').value = lv.target || '';
  setLine('entry', lv.entry || null);
  setLine('stop', lv.stop || null);
  setLine('target', lv.target || null);
}

// drag: pick the nearest line, move it, push on release
let dragging = null;
const overlay = $('dragOverlay');
overlay.addEventListener('mousedown', (e) => {
  const lv = readLevels();
  const y = e.offsetY;
  let best = null, bestDist = 12;
  for (const [name, price] of Object.entries(lv)) {
    if (!price) continue;
    const c = priceSeries.priceToCoordinate(price);
    if (c == null) continue;
    const d = Math.abs(c - y);
    if (d < bestDist) { bestDist = d; best = { name, price }; }
  }
  if (best && best.name === 'entry' && bracket && bracket.entryLocked) {
    flash('entry locked after fill');
    return;
  }
  if (best) dragging = best;
});
overlay.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const price = priceSeries.coordinateToPrice(e.offsetY);
  if (price == null) return;
  dragging.price = Math.round(price * 100) / 100;
  showLevels({ ...readLevels(), [dragging.name]: dragging.price });
});
window.addEventListener('mouseup', async () => {
  if (!dragging) return;
  const lv = readLevels();
  if (bracket && bracket.state !== 'closed') {
    const r = await post('/api/levels', { symbol, entry: lv.entry, stop: lv.stop, target: lv.target });
    if (!r.ok) { flash(r.error); renderLegs(); }
  }
  dragging = null;
});
['inEntry', 'inStop', 'inTarget'].forEach((id) =>
  $(id).addEventListener('change', async () => {
    const lv = readLevels();
    showLevels(lv);
    if (bracket && bracket.state !== 'closed') {
      const r = await post('/api/levels', { symbol, ...lv });
      if (!r.ok) { flash(r.error); renderLegs(); }
    }
  })
);

let noteTimer = null;
function flash(msg) {
  $('note').textContent = msg;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { $('note').textContent = ''; }, 4000);
}

// ---- MACD (12, 26, 9) from the visible bars ----
function ema(values, period) {
  const k = 2 / (period + 1);
  const out = [];
  let prev = values[0];
  for (let i = 0; i < values.length; i++) {
    prev = i === 0 ? values[0] : values[i] * k + prev * (1 - k);
    out.push(prev);
  }
  return out;
}
function renderMacd() {
  const data = [...bars[tf].values()].sort((a, b) => a.time - b.time);
  if (data.length < 35) { macdHist.setData([]); macdLine.setData([]); signalLine.setData([]); return; }
  const closes = data.map((b) => b.close);
  const e12 = ema(closes, 12), e26 = ema(closes, 26);
  const macd = closes.map((_, i) => e12[i] - e26[i]);
  const signal = ema(macd, 9);
  macdHist.setData(data.map((b, i) => ({ time: b.time, value: macd[i] - signal[i], color: macd[i] >= signal[i] ? '#26a69a55' : '#ef535055' })));
  macdLine.setData(data.map((b, i) => ({ time: b.time, value: macd[i] })));
  signalLine.setData(data.map((b, i) => ({ time: b.time, value: signal[i] })));
}

// ---- data ----
function currentBarsArray() {
  return [...bars[tf].values()].sort((a, b) => a.time - b.time);
}
function setTf(next) {
  tf = next;
  document.querySelectorAll('.tf').forEach((b) => b.classList.toggle('active', b.dataset.tf === tf));
  priceChart.applyOptions({ timeScale: { timeVisible: tf !== '1d', secondsVisible: tf !== '1d' } });
  macdChart.applyOptions({ timeScale: { timeVisible: tf !== '1d', secondsVisible: tf !== '1d' } });
  priceSeries.setData(currentBarsArray());
  renderMacd();
  priceChart.timeScale().fitContent();
}
document.querySelectorAll('.tf').forEach((b) => b.addEventListener('click', () => setTf(b.dataset.tf)));

// ---- SSE ----
const es = new EventSource('/events');
const tapeEl = $('tape');
let lastTapePrice = null;

es.onmessage = (e) => {
  const m = JSON.parse(e.data);
  switch (m.t) {
    case 'conn':
      $('dot').className = 'dot' + (m.connected ? ' on' : '');
      $('connText').textContent = m.connected ? `connected ${m.host}:${m.ibPort}` : 'disconnected';
      $('nextId').textContent = m.nextValidId || '-';
      $('reconText').textContent = m.reconciled ? 'reconciled' : 'reconciling...';
      break;
    case 'hist':
      bars[m.tf] = new Map(m.bars.map((b) => [b.time, b]));
      if (m.tf === tf) { priceSeries.setData(currentBarsArray()); renderMacd(); priceChart.timeScale().fitContent(); }
      break;
    case 'bar':
      bars[m.tf].set(m.bar.time, m.bar);
      if (m.tf === tf) { priceSeries.update(m.bar); renderMacd(); }
      break;
    case 'tape': {
      const tr = m.trade;
      const row = document.createElement('div');
      row.className = 'trow';
      const up = lastTapePrice == null || tr.price >= lastTapePrice;
      lastTapePrice = tr.price;
      row.innerHTML = `<span style="color:${up ? '#26a69a' : '#ef5350'}">${tr.price.toFixed(2)}</span><span>${tr.size}</span><span>${new Date(tr.time * 1000).toLocaleTimeString()}</span>`;
      tapeEl.prepend(row);
      while (tapeEl.childNodes.length > 200) tapeEl.lastChild.remove();
      break;
    }
    case 'tapeFull':
      tapeEl.innerHTML = '';
      lastTapePrice = null;
      m.trades.slice().reverse().forEach((tr) => {
        const row = document.createElement('div');
        row.className = 'trow';
        const up = lastTapePrice == null || tr.price >= lastTapePrice;
        lastTapePrice = tr.price;
        row.innerHTML = `<span style="color:${up ? '#26a69a' : '#ef5350'}">${tr.price.toFixed(2)}</span><span>${tr.size}</span><span>${new Date(tr.time * 1000).toLocaleTimeString()}</span>`;
        tapeEl.prepend(row);
      });
      break;
    case 'depth': {
      const d = $('depth');
      d.innerHTML = '';
      m.book.asks.slice().reverse().forEach((r) => {
        d.appendChild(depthRow(r, 'ask'));
      });
      d.appendChild(depthRow(null, 'mid'));
      m.book.bids.forEach((r) => d.appendChild(depthRow(r, 'bid')));
      break;
    }
    case 'bracket':
      pendingSymbols = new Set(m.bracket._pending || []);
      bracket = (m.bracket && m.bracket[symbol]) || null;
      renderLegs();
      break;
    case 'audit': {
      const a = $('audit');
      a.textContent = m.line + '\n' + a.textContent;
      break;
    }
    case 'info':
      console.log(m.msg);
      break;
  }
};

function depthRow(r, side) {
  const div = document.createElement('div');
  div.className = 'drow ' + side;
  if (!r) { div.innerHTML = '<span>--</span><span>--</span>'; return div; }
  div.innerHTML = `<span>${r.price.toFixed(2)}</span><span>${r.size}</span>`;
  return div;
}

// ---- legs table ----
function renderLegs() {
  const tb = $('legs');
  tb.innerHTML = '';
  if (!bracket) { showLevels(readLevels()); }
  const busy = pendingSymbols.has(symbol) || (bracket && bracket.state !== 'closed');
  $('arm').disabled = !!busy;
  $('disarm').disabled = !bracket || bracket.state === 'closed';
}

// ---- actions ----
async function post(url, body) {
  const r = await fetch(url, {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
  });
  return r.json();
}

$('go').addEventListener('click', () => {
  symbol = $('symbol').value.toUpperCase().trim();
  $('symbol').value = symbol;
  post('/api/symbol', { symbol });
  tapeEl.innerHTML = '';
});
$('symbol').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });

$('arm').addEventListener('click', () => {
  const lv = readLevels();
  $('confirmText').textContent =
    `${symbol}  qty=${$('qty').value}  ${$('otype').value}  entry=${lv.entry || 'market'}  stop=${lv.stop}  target=${lv.target}`;
  $('modal').style.display = 'flex';
});
$('confirmNo').addEventListener('click', () => { $('modal').style.display = 'none'; });
$('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') $('modal').style.display = 'none'; });
$('confirmYes').addEventListener('click', async () => {
  $('modal').style.display = 'none';
  const lv = readLevels();
  const r = await post('/api/arm', {
    symbol, qty: Number($('qty').value), entry: lv.entry || 0,
    stop: lv.stop, target: lv.target, orderType: $('otype').value,
  });
  if (!r.ok) alert(r.error);
});
$('disarm').addEventListener('click', async () => {
  const r = await post('/api/disarm', { symbol, reason: 'gui disarm' });
  if (!r.ok) alert(r.error);
});

new ResizeObserver(() => { priceChart.applyOptions({ width: $('priceChart').clientWidth }); }).observe($('priceChart'));
new ResizeObserver(() => { macdChart.applyOptions({ width: $('macdChart').clientWidth }); }).observe($('macdChart'));

// pixel y for a price, used by the e2e drag test
window.__priceToY = (p) => priceSeries.priceToCoordinate(p);

$('go').click();
</script>
</body>
</html>
